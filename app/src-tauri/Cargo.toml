[package]
name = "salamandra-app"
description = "App do Salamandra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "salamandra_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
salamandra-core = { path = "../../crates/salamandra-core", features = ["serde"] }
salamandra-hid = { path = "../../crates/salamandra-hid" }
salamandra-service = { path = "../../crates/salamandra-service" }
