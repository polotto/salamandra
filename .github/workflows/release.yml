name: Release

# Gera os instaladores dos três sistemas e anexa numa Release em rascunho. Depois
# anexa o CLI e o servidor MCP (sem Tauri) na mesma Release.
# Dispara com tag vX.Y.Z, ou à mão (workflow_dispatch) escolhendo a tag como ref.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          # Fixo em 24.04: ubuntu-latest vira 26 em 19/10/2026 e as libs do Tauri mudam.
          - os: ubuntu-24.04
            args: --bundles deb,rpm,appimage
          - os: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Front dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Salamandra ${{ github.ref_name }}
          releaseBody: Veja as instruções de instalação no README.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # Roda depois do `build`, quando o rascunho da Release já existe, para não
  # disputar com o tauri-action a criação dele.
  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked --target "$target" -p salamandra-cli -p salamandra-mcp
            done
            mkdir -p dist
            for bin in salamandra salamandra-mcp; do
              lipo -create -output "dist/$bin" \
                "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
            done
          else
            cargo build --release --locked -p salamandra-cli -p salamandra-mcp
            mkdir -p dist
            for bin in salamandra salamandra-mcp; do
              cp "target/release/$bin${{ runner.os == 'Windows' && '.exe' || '' }}" dist/
            done
          fi

      - name: Package
        run: |
          pack="salamandra-cli-${{ github.ref_name }}-${{ matrix.name }}"
          cp LICENSE README.md dist/
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a "../$pack.zip" . > /dev/null)
            echo "ASSET=$pack.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "$pack.tar.gz" .
            echo "ASSET=$pack.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET" --clobber --repo "${{ github.repository }}"
